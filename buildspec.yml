version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 552738071495.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t cloud-app .
      - docker tag cloud-app:latest 552738071495.dkr.ecr.us-east-1.amazonaws.com/cloud-app:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 552738071495.dkr.ecr.us-east-1.amazonaws.com/cloud-app:latest
