version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo "=== Installing dependencies ==="
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pytest

  pre_build:
    commands:
      - echo "=== Running unit tests ==="
      - pytest
      - echo "=== Logging in to Amazon ECR ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "=== Building Docker image ==="
      - docker build -t cloud-app:latest .
      - docker tag cloud-app:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/cloud-app:latest

  post_build:
    commands:
      - echo "=== Pushing Docker image to ECR ==="
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/cloud-app:latest
      - echo "=== Build and Push completed successfully ==="
